[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "automationhat"
dynamic = ["version", "readme", "optional-dependencies"]
description = "Driver for the Pimoroni Automation HAT"
license = {file = "LICENSE"}
requires-python = ">= 3.9"
authors = [
    { name = "Philip Howard", email = "phil@pimoroni.com" },
]
maintainers = [
    { name = "Philip Howard", email = "phil@pimoroni.com" },
]
keywords = [
    "Pi",
    "Raspberry",
    "automation controller"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Hardware",
]
dependencies = [
    "gpiod>=2.1.3",
    "gpiodevice>=0.0.5",
    "sn3218>=3.0.0",
    "st7735>=1.0.0",
    "ads1015>=1.0.0"
]

[tool.hatch.metadata.hooks.requirements_txt.optional-dependencies]
example-depends = ["requirements-examples.txt"]

[project.urls]
GitHub = "https://www.github.com/pimoroni/automationhat-python"
Homepage = "https://www.pimoroni.com"

[dependency-groups]
dev = [
    "check-manifest",
    "ruff==0.15.20",
    "codespell",
    "pre-commit",
    "twine",
    "hatch",
    "hatch-fancy-pypi-readme",
    "hatch-requirements-txt",
    "tox",
    "pdoc",
]

[tool.hatch.version]
path = "automationhat/__init__.py"

[tool.hatch.build]
include = [
    "automationhat",
]

[tool.hatch.build.targets.sdist]
include = [
    "*"
]
exclude = [
    ".*",
    "dist"
]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [
  { path = "README.md" },
  { text = "\n" },
  { path = "CHANGELOG.md" }
]

[tool.ruff]
exclude = [
    '.tox',
    '.egg',
    '.git',
    '__pycache__',
    'build',
    'dist'
]
line-length = 200

[tool.ruff.lint]
extend-select = ["I", "UP", "SIM", "PIE", "C4", "B", "RUF", "PERF", "FURB", "PLE"]

[tool.codespell]
skip = """
./.tox,\
./.egg,\
./.git,\
./__pycache__,\
./build,\
./dist.\
"""

[tool.check-manifest]
ignore = [
    'boilerplate.md',
    'install.sh',
    'uninstall.sh',
    'Makefile',
    'tox.ini',
    'tests/*',
    'examples/*',
    '.coveragerc',
    '.editorconfig',
    '.pre-commit-config.yaml',
]

[tool.pimoroni]
apt_packages = []
configtxt = []
commands = [
    "sudo raspi-config nonint do_spi 0",
    "sudo raspi-config nonint do_i2c 0"
]
